name: Deploy docs

# Manual only until the deploy target exists. To deploy on every push to main,
# add a `push` trigger on `main` with the paths `docs/**`, `assets/**`,
# `bin/install.sh` and this file.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install mdbook
        uses: taiki-e/install-action@v2.87.28
        with:
          tool: mdbook
      - name: Build mdbook
        run: mdbook build -d ../book
        working-directory: ./docs/books
      - name: Copy assets
        run: |
          mkdir -p docs/assets
          cp assets/logo.svg assets/og-image.png docs/assets/
      - name: Copy install script
        run: cp bin/install.sh docs/install.sh
      - name: Deploy
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }}
