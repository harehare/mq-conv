[package]
authors = ["Takahiro Sato <harehare1110@gmail.com>"]
categories = ["command-line-utilities", "text-processing"]
description = "A CLI tool for converting various file formats to Markdown"
edition = "2024"
homepage = "https://mqlang.org/"
keywords = ["markdown", "converter", "cli", "pdf", "pandoc"]
license = "MIT"
name = "mq-conv"
readme = "README.md"
repository = "https://github.com/harehare/mq-conv"
version = "0.3.0"

[[bin]]
name = "mq-conv"
path = "src/main.rs"

[lib]
crate-type = ["cdylib", "rlib"]
name = "mq_conv"
path = "src/lib.rs"

[features]
asciidoc = []
audio = ["dep:lofty"]
default = ["documents", "markup", "writers", "media", "sqlite", "query"]
epub = ["dep:zip", "dep:quick-xml"]
excel = ["dep:calamine"]
image = ["dep:image", "dep:kamadak-exif"]
markdown_asciidoc = []
markdown_docx = ["dep:docx-rs"]
markdown_epub_out = ["dep:epub-builder"]
markdown_html = []
markdown_json_ast = ["dep:serde_json"]
markdown_latex = []
markdown_org = []
markdown_rst = []
markdown_text = []
mediawiki = []
mobi = ["dep:mobi"]
ocr = ["dep:leptess"]
org = []
pdf = ["dep:lopdf", "dep:encoding_rs", "dep:flate2"]
powerpoint = ["dep:zip", "dep:quick-xml"]
query = ["dep:mq-lang"]
rst = []
sqlite = ["dep:rusqlite"]
tar = ["dep:tar", "dep:flate2"]
video = ["dep:lofty"]
word = ["dep:zip", "dep:quick-xml"]
zip = ["dep:zip"]

# Feature groups.
documents = ["excel", "pdf", "powerpoint", "word", "epub", "mobi", "zip"]
markup = ["rst", "org", "mediawiki", "asciidoc"]
media = ["image", "audio", "video", "tar"]
writers = [
  "markdown_docx",
  "markdown_html",
  "markdown_text",
  "markdown_latex",
  "markdown_rst",
  "markdown_asciidoc",
  "markdown_org",
  "markdown_epub_out",
  "markdown_json_ast",
]

# WebAssembly builds leave out sqlite, query and ocr, which need native code.
wasm = ["documents", "markup", "writers", "media"]
wasm_slim = ["documents", "markup", "writers"]

[dependencies]
clap = {version = "4.6", features = ["derive"]}
miette = {version = "7", features = ["fancy"]}
thiserror = "2"

calamine = {version = "0.38", optional = true}
docx-rs = {version = "0.4", optional = true}
encoding_rs = {version = "0.8", optional = true}
epub-builder = {version = "0.8", optional = true}
flate2 = {version = "1", optional = true}
image = {version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"]}
kamadak-exif = {version = "0.6", optional = true}
leptess = {version = "0.14", optional = true}
lofty = {version = "0.25", optional = true}
lopdf = {version = "0.46", optional = true, default-features = false}
mobi = {version = "0.8", optional = true}
mq-lang = {version = "0.10.0", optional = true}
mq-markdown = {version = "0.10.0", features = ["html-to-markdown", "json"]}
quick-xml = {version = "0.42", optional = true}
rusqlite = {version = "0.41", optional = true, features = ["bundled"]}
serde_json = {version = "1", optional = true, features = ["preserve_order"]}
tar = {version = "0.4", optional = true}
zip = {version = "9.0", optional = true, default-features = false, features = ["deflate"]}

[target.'cfg(target_arch = "wasm32")'.dependencies]
lopdf = {version = "0.45", optional = true, default-features = false, features = ["wasm_js"]}
uuid = {version = "1", features = ["js"]}
wasm-bindgen = "0.2"

[dev-dependencies]
pretty_assertions = "1"
rstest = "0.28"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O4', '--enable-bulk-memory', '--enable-nontrapping-float-to-int']
